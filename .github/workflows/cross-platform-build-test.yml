name: Cross-Platform Build & Test (Clean Architecture)

# racecar fork-testbed patch. Changes from upstream:
#   1. workflow_dispatch with a `leg` input, so racecar can trigger a run and
#      choose baseline vs instrumented. Upstream fires on push/PR, which racecar
#      cannot drive.
#   2. actions/checkout -> crashappsec/action-checkout, which wraps checkout and
#      setup-chalk-action together. `chalk:` is the single variable separating
#      the two arms, and `profile:` selects the observables profile.
#   3. permissions: id-token: write for the action's OIDC connect. Declaring the
#      block zeroes every unlisted scope, so the rest is restated.
#   4. A fail-closed assertion on the instrumented arm.
#   5. fail-fast: false on every matrix -- a measurement-integrity change, not a
#      build change: the instrumented arm has strictly more failure surface, so
#      fail-fast cancels its siblings more often than baseline's and biases the
#      comparison.
# Build and test COMMANDS are byte-identical to upstream.

on:
  push:
    branches:
    - '**'
    paths:
    - 'src/**'
    - 'tests/**'
    - 'Clean.Architecture.slnx'
    - 'Directory.Build.props'
    - 'Directory.Packages.props'
    - 'global.json'
    - '.github/workflows/cross-platform-build-test.yml'
  pull_request:
    branches:
    - '**'
    paths:
    - 'src/**'
    - 'tests/**'
    - 'Clean.Architecture.slnx'
    - 'Directory.Build.props'
    - 'Directory.Packages.props'
    - 'global.json'
    - '.github/workflows/cross-platform-build-test.yml'
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

run-name: "Cross-Platform Build & Test (Clean Architecture) ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms. On baseline, action-checkout
  # skips its Set up Chalk step entirely. The github.event_name guard keeps
  # incidental push/PR runs uninstrumented, where inputs.leg is empty.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ${{ matrix.os }}

    # Matrix strategy tests all OS combinations
    strategy:
      matrix:
        os: [ubuntu-latest]  # All major platforms
        configuration: [Release]
      fail-fast: false

    steps:
      # v6 uses Node.js 24 (v4 uses deprecated Node.js 20)
      # fetch-depth: 0 gets full history (needed for some versioning tools)
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          # inert at action-checkout@main (not an input there); kept for forward-compat
        observables_continue_on_error: false
          # action-checkout defaults LFS on; actions/checkout does not
        lfs: false
        fetch-depth: 0
    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'ga'    # General Availability - stable release

      # Explicit restore with environment vars for faster first-run
    - name: Restore dependencies
      run: dotnet restore Clean.Architecture.slnx --verbosity normal
      env:
        DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true    # Skip .NET welcome message
        DOTNET_CLI_TELEMETRY_OPTOUT: true    # Disable telemetry for faster CI

      # --no-restore skips redundant package restore
    - name: Build (${{ matrix.configuration }})
      run: dotnet build Clean.Architecture.slnx --configuration ${{ matrix.configuration }} --no-restore --verbosity minimal

      # Unit tests - fast, no external dependencies
      # TRX logger + code coverage for detailed reports
    - name: Run Unit Tests (${{ matrix.configuration }})
      run: dotnet test tests/Clean.Architecture.UnitTests/Clean.Architecture.UnitTests.csproj --configuration ${{ matrix.configuration }} --no-build --verbosity normal --logger "trx" --collect:"XPlat Code Coverage"

      # Integration tests - may have external dependencies
      # continue-on-error: true allows workflow to complete even if tests fail
    - name: Run Integration Tests (${{ matrix.configuration }})
      run: dotnet test tests/Clean.Architecture.IntegrationTests/Clean.Architecture.IntegrationTests.csproj --configuration ${{ matrix.configuration }} --no-build --verbosity normal --logger "trx" --collect:"XPlat Code Coverage"
      continue-on-error: true    # Don't fail entire workflow on integration test issues

      # Functional tests - filter excludes Docker-dependent tests in CI
    - name: Run Functional Tests
      run: dotnet test tests/Clean.Architecture.FunctionalTests/Clean.Architecture.FunctionalTests.csproj --configuration ${{ matrix.configuration }} --no-build --verbosity normal --logger "trx" --filter "FullyQualifiedName!~DockerAvailabilityTests" --collect:"XPlat Code Coverage"
      continue-on-error: true    # Don't fail entire workflow on functional test issues

      # Upload test results even if tests failed (if: always())
      # Retention 30 days balances storage costs and debugging needs
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.configuration }}
        path: '**/TestResults/**/*.trx'
        retention-days: 30

      # Code coverage reports for quality tracking
    - name: Upload Coverage
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: coverage-${{ matrix.os }}-${{ matrix.configuration }}
        path: '**/TestResults/**/coverage.cobertura.xml'
        retention-days: 30
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
